name: Actualizar ranking SoloBoom LAS

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: soloboom-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Consultar la API de Riot y armar data.json
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python3 fetch_data.py

      - name: Guardar los cambios en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Actualizar ranking $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
